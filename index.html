<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MMA Cage Combat Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #030712; overflow: hidden; font-family: 'Courier New', monospace; color: #00f0ff; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-container {
            position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; padding: 14px 16px;
            display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .header-row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px; font-weight: bold; }
        .hud-row { display: flex; justify-content: space-between; align-items: center; }
        .fighter-hud { width: 44%; }
        .bars { height: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(0,240,255,0.4); position: relative; overflow: hidden; border-radius: 2px; }
        .fill { height: 100%; width: 100%; transition: width 0.1s linear; }
        .player-fill { background: linear-gradient(90deg, #00f0ff, #0077b6); }
        .enemy-fill { background: linear-gradient(90deg, #ff0055, #99002b); }
        .telemetry-tag { font-size: 9px; color: #64748b; margin-top: 3px; }
        
        #wave-box {
            border: 1px solid #00f0ff; background: rgba(0, 240, 255, 0.08);
            padding: 3px 8px; font-size: 11px; text-align: center; border-radius: 4px;
        }

        #overlay {
            position: absolute; inset: 0; background: rgba(3, 7, 18, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; backdrop-filter: blur(6px);
        }
        .hud-btn {
            background: rgba(0, 240, 255, 0.1); border: 2px solid #00f0ff;
            color: #00f0ff; padding: 14px 28px; font-size: 15px; font-weight: bold;
            letter-spacing: 2px; font-family: inherit; cursor: pointer; margin-top: 18px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35); border-radius: 4px;
        }
        .hud-btn:active { background: #00f0ff; color: #030712; }

        #controls-container {
            position: absolute; bottom: 12px; left: 0; width: 100%; padding: 0 16px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 10;
        }
        .control-group { display: flex; gap: 8px; }
        .btn-ctrl {
            width: 58px; height: 58px; border-radius: 8px; border: 1px solid rgba(0, 240, 255, 0.4);
            background: rgba(0, 240, 255, 0.06); color: #00f0ff; font-family: inherit; font-size: 11px;
            font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; pointer-events: auto; backdrop-filter: blur(2px);
        }
        .btn-ctrl:active { background: #00f0ff; color: #030712; }
        .debug-toggle-btn {
            position: absolute; top: 96px; left: 16px; pointer-events: auto;
            border: 1px dashed #00f0ff; background: rgba(0,240,255,0.06); color: #00f0ff;
            padding: 4px 8px; font-size: 10px; cursor: pointer; z-index: 10; border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="header-row">
            <div>MARK VII // SYS.ONLINE</div>
            <div style="color:#ff0055;">SYS STBY</div>
        </div>
        <div class="hud-row">
            <div class="fighter-hud">
                <div>CORE HP: <span id="playerHpText">100</span>%</div>
                <div class="bars"><div id="playerHpBar" class="fill player-fill"></div></div>
                <div class="telemetry-tag">CHAMPION</div>
            </div>
            <div id="wave-box">WAVE<br><span style="font-size: 16px; font-weight: bold;">03</span></div>
            <div class="fighter-hud" style="text-align: right;">
                <div>OPPONENT HP: <span id="enemyHpText">100</span>%</div>
                <div class="bars"><div id="enemyHpBar" class="fill enemy-fill"></div></div>
                <div class="telemetry-tag">CHALLENGER</div>
            </div>
        </div>
    </div>

    <button id="debugToggle" class="debug-toggle-btn">DEBUG: OFF</button>

    <div id="controls-container">
        <div class="control-group">
            <button id="btnLeft" class="btn-ctrl">◀<br>L</button>
            <button id="btnRight" class="btn-ctrl">▶<br>R</button>
        </div>
        <div class="control-group" style="flex-direction: column; gap: 6px;">
            <div class="control-group">
                <button id="btnGuardHigh" class="btn-ctrl" style="border-color:#f8fafc;">G-HI<br>↑</button>
                <button id="btnGuardLow" class="btn-ctrl" style="border-color:#64748b;">G-LO<br>↓</button>
            </div>
            <div class="control-group">
                <button id="btnPunch" class="btn-ctrl">PUNCH<br>(J)</button>
                <button id="btnKick" class="btn-ctrl">KICK<br>(K)</button>
            </div>
        </div>
    </div>

    <div id="overlay">
        <h1 style="letter-spacing: 3px; margin-bottom: 6px;">CAGE FIGHTER</h1>
        <p style="color: #64748b; font-size: 12px; margin-bottom: 16px;">OCTAGON HIGH-LOW COMBAT ENGINE</p>
        <button id="startBtn" class="hud-btn">INITIALIZE COMBAT</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
    const CONFIG = {
        PLAYER_SPEED: 4,
        AI_SPEED: 2.2,
        PUNCH_RANGE: 85,
        KICK_RANGE: 105,
        BASE_DAMAGE: 14,
        CHIP_DAMAGE_MULT: 0.15,
        OCTAGON_PADDING: 50,
        KNOCKBACK: 22
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const debugToggle = document.getElementById('debugToggle');

    const playerHpText = document.getElementById('playerHpText');
    const playerHpBar = document.getElementById('playerHpBar');
    const enemyHpText = document.getElementById('enemyHpText');
    const enemyHpBar = document.getElementById('enemyHpBar');

    let W, H;
    let running = false;
    let showDebug = false;
    let shakeTimer = 0;
    let hitStop = 0;

    let fighters = [];
    let particles = [];
    let flyTexts = [];

    const SoundFx = {
        ctx: null,
        init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        playPunch() {
            if (!this.ctx) return;
            const o = this.ctx.createOscillator(), g = this.ctx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(160, this.ctx.currentTime);
            o.frequency.exponentialRampToValueAtTime(15, this.ctx.currentTime + 0.1);
            g.gain.setValueAtTime(0.5, this.ctx.currentTime); g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + 0.12);
        },
        playKick() {
            if (!this.ctx) return;
            const o = this.ctx.createOscillator(), g = this.ctx.createGain();
            o.type = 'sawtooth'; o.frequency.setValueAtTime(220, this.ctx.currentTime);
            o.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.18);
            g.gain.setValueAtTime(0.45, this.ctx.currentTime); g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + 0.2);
        },
        playBlock() {
            if (!this.ctx) return;
            const o = this.ctx.createOscillator(), g = this.ctx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(380, this.ctx.currentTime);
            o.frequency.linearRampToValueAtTime(300, this.ctx.currentTime + 0.08);
            g.gain.setValueAtTime(0.3, this.ctx.currentTime); g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + 0.08);
        }
    };

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const keys = { Left: false, Right: false, GuardHigh: false, GuardLow: false };
    const mobileControls = { Left: false, Right: false, GuardHigh: false, GuardLow: false };

    window.addEventListener('keydown', e => {
        if (e.code === 'KeyA') keys.Left = true;
        if (e.code === 'KeyD') keys.Right = true;
        if (e.code === 'ArrowUp') { keys.GuardHigh = true; keys.GuardLow = false; }
        if (e.code === 'ArrowDown') { keys.GuardLow = true; keys.GuardHigh = false; }
        if (e.code === 'KeyJ') fireAttack(fighters[0], 'Punch');
        if (e.code === 'KeyK') fireAttack(fighters[0], 'Kick');
    });
    window.addEventListener('keyup', e => {
        if (e.code === 'KeyA') keys.Left = false;
        if (e.code === 'KeyD') keys.Right = false;
        if (e.code === 'ArrowUp') keys.GuardHigh = false;
        if (e.code === 'ArrowDown') keys.GuardLow = false;
    });

    function setupMobileBtn(id, prop) {
        const btn = document.getElementById(id);
        const on = (e) => { e.preventDefault(); mobileControls[prop] = true; };
        const off = (e) => { e.preventDefault(); mobileControls[prop] = false; };
        btn.addEventListener('touchstart', on);
        btn.addEventListener('touchend', off);
        btn.addEventListener('mousedown', on);
        btn.addEventListener('mouseup', off);
    }
    setupMobileBtn('btnLeft', 'Left');
    setupMobileBtn('btnRight', 'Right');
    setupMobileBtn('btnGuardHigh', 'GuardHigh');
    setupMobileBtn('btnGuardLow', 'GuardLow');

    document.getElementById('btnPunch').addEventListener('pointerdown', () => fireAttack(fighters[0], 'Punch'));
    document.getElementById('btnKick').addEventListener('pointerdown', () => fireAttack(fighters[0], 'Kick'));

    debugToggle.addEventListener('click', () => {
        showDebug = !showDebug;
        debugToggle.innerText = `DEBUG: ${showDebug ? 'ON' : 'OFF'}`;
        debugToggle.style.borderStyle = showDebug ? 'solid' : 'dashed';
    });

    function createFighter(x, color, isPlayer) {
        return {
            x, y: H * 0.55, h: 150, color, isPlayer,
            hp: 100, isLeft: isPlayer,
            actionState: 'idle', stateTimer: 0,
            isBlockingHigh: false, isBlockingLow: false,
            velX: 0
        };
    }

    function spawnParticle(x, y, color) {
        for (let i = 0; i < 18; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.5) * 9 - 2,
                alpha: 1.0, size: Math.random() * 3 + 1.5, color
            });
        }
    }

    function spawnText(x, y, str, color) {
        flyTexts.push({ x, y, str, color, alpha: 1.0, vy: -1.4 });
    }

    function fireAttack(attacker, type) {
        if (!running || attacker.actionState !== 'idle') return;
        attacker.actionState = type;
        attacker.stateTimer = type === 'Punch' ? 14 : 20;

        const range = type === 'Punch' ? CONFIG.PUNCH_RANGE : CONFIG.KICK_RANGE;
        const target = fighters.find(f => f !== attacker);
        const distance = Math.abs(attacker.x - target.x);

        if (distance <= range) {
            let result = 'CLEAN';
            let targetY = target.y + (type === 'Punch' ? -25 : 65);

            if (type === 'Punch' && target.isBlockingHigh) result = 'BLOCKED';
            if (type === 'Kick' && target.isBlockingLow) result = 'BLOCKED';

            const hitX = (attacker.x + target.x) / 2;

            if (result === 'BLOCKED') {
                SoundFx.playBlock();
                target.hp -= CONFIG.BASE_DAMAGE * CONFIG.CHIP_DAMAGE_MULT;
                spawnParticle(hitX, targetY, '#94a3b8');
                spawnText(hitX, targetY - 20, 'BLOCKED', '#f1f5f9');
            } else {
                if (type === 'Punch') SoundFx.playPunch(); else SoundFx.playKick();
                target.hp = Math.max(0, target.hp - CONFIG.BASE_DAMAGE);
                target.x += attacker.isLeft ? CONFIG.KNOCKBACK : -CONFIG.KNOCKBACK;
                shakeTimer = 7;
                hitStop = 2; // Hit-stop frame freeze
                spawnParticle(hitX, targetY, attacker.color);
                spawnText(hitX, targetY - 24, `${type === 'Punch' ? 'PUNCH' : 'SWEEP'} HIT!`, attacker.color);
                spawnText(hitX, targetY, '+50 PTS', '#ffffff');
            }

            playerHpBar.style.width = fighters[0].hp + '%';
            playerHpText.innerText = Math.round(fighters[0].hp);
            enemyHpBar.style.width = fighters[1].hp + '%';
            enemyHpText.innerText = Math.round(fighters[1].hp);

            if (fighters[0].hp <= 0 || fighters[1].hp <= 0) endGame();
        }
    }

    // Procedural Humanoid Figure Drawing Routine
    function drawFighterFigure(f) {
        const dir = f.isLeft ? 1 : -1;
        const baseY = f.y;
        const headY = baseY - 45;
        const chestY = baseY - 10;
        const pelvisY = baseY + 25;
        const footY = baseY + 85;

        ctx.save();
        ctx.strokeStyle = f.color;
        ctx.fillStyle = f.color;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = f.color;
        ctx.shadowBlur = 12;

        // 1. Helmet / Head
        ctx.beginPath();
        ctx.arc(f.x, headY, 13, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#030712';
        ctx.fill();

        // 2. Torso & Spine
        ctx.beginPath();
        ctx.moveTo(f.x, headY + 13);
        ctx.lineTo(f.x, pelvisY);
        ctx.stroke();

        // 3. Legs
        if (f.actionState === 'Kick') {
            // Front Leg Extended Side Kick
            ctx.beginPath();
            ctx.moveTo(f.x, pelvisY);
            ctx.lineTo(f.x + dir * 35, pelvisY + 15);
            ctx.lineTo(f.x + dir * 75, pelvisY + 30);
            ctx.stroke();
            // Back Support Leg
            ctx.beginPath();
            ctx.moveTo(f.x, pelvisY);
            ctx.lineTo(f.x - dir * 15, pelvisY + 35);
            ctx.lineTo(f.x - dir * 20, footY);
            ctx.stroke();
        } else {
            // Natural Fighting Stance Legs
            ctx.beginPath();
            ctx.moveTo(f.x, pelvisY);
            ctx.lineTo(f.x + dir * 12, pelvisY + 30);
            ctx.lineTo(f.x + dir * 18, footY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(f.x, pelvisY);
            ctx.lineTo(f.x - dir * 14, pelvisY + 30);
            ctx.lineTo(f.x - dir * 16, footY);
            ctx.stroke();
        }

        // 4. Arms & Guard Stances
        if (f.actionState === 'Punch') {
            // Full Extended Jab Arm
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 30, chestY - 12);
            ctx.lineTo(f.x + dir * 65, chestY - 12);
            ctx.stroke();
            // Guard Hand at Chin
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x - dir * 8, chestY);
            ctx.lineTo(f.x + dir * 10, headY + 5);
            ctx.stroke();
        } else if (f.isBlockingHigh) {
            // Crossed Double Forearm Guard (High Shell)
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 15, headY - 5);
            ctx.lineTo(f.x + dir * 22, headY - 12);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 10, headY);
            ctx.lineTo(f.x + dir * 18, headY - 6);
            ctx.stroke();
        } else if (f.isBlockingLow) {
            // Dropped Arm Shin Check (Low Block)
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 18, pelvisY + 15);
            ctx.lineTo(f.x + dir * 25, pelvisY + 45);
            ctx.stroke();
        } else {
            // Default Neutral MMA Boxing Guard
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 18, chestY - 5);
            ctx.lineTo(f.x + dir * 22, headY + 5);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 10, chestY);
            ctx.lineTo(f.x + dir * 14, headY + 8);
            ctx.stroke();
        }

        ctx.restore();

        // 5. Developer Hitbox Telemetry Boxes (When Debug is On)
        if (showDebug) {
            ctx.save();
            ctx.font = '9px Courier New';
            ctx.lineWidth = 1;

            // Head (High)
            ctx.strokeStyle = '#ef4444';
            ctx.strokeRect(f.x - 22, headY - 18, 44, 38);
            ctx.fillStyle = '#ef4444';
            ctx.fillText('Head (High)', f.x + (f.isLeft ? 26 : -90), headY);

            // Torso (Mid)
            ctx.strokeStyle = '#f97316';
            ctx.strokeRect(f.x - 24, chestY - 10, 48, 45);
            ctx.fillStyle = '#f97316';
            ctx.fillText('Torso (Mid)', f.x + (f.isLeft ? 26 : -90), chestY + 18);

            // Legs (Low)
            ctx.strokeStyle = '#eab308';
            ctx.strokeRect(f.x - 26, pelvisY + 5, 52, 60);
            ctx.fillStyle = '#eab308';
            ctx.fillText('Leg (Low)', f.x + (f.isLeft ? 26 : -90), pelvisY + 38);

            ctx.restore();
        }
    }

    function update() {
        if (!running) return;
        if (hitStop > 0) { hitStop--; return; }

        const leftLimit = CONFIG.OCTAGON_PADDING;
        const rightLimit = W - CONFIG.OCTAGON_PADDING;

        fighters.forEach(f => {
            f.y = H * 0.52; // Centered comfortably above mobile touch controls

            if (f.stateTimer > 0) {
                f.stateTimer--;
                if (f.stateTimer <= 0) f.actionState = 'idle';
            }

            if (f.isPlayer) {
                const mvL = keys.Left || mobileControls.Left;
                const mvR = keys.Right || mobileControls.Right;
                f.isBlockingHigh = keys.GuardHigh || mobileControls.GuardHigh;
                f.isBlockingLow = keys.GuardLow || mobileControls.GuardLow;

                f.velX = 0;
                if (mvL) f.velX = -CONFIG.PLAYER_SPEED;
                if (mvR) f.velX = CONFIG.PLAYER_SPEED;
                if (f.actionState !== 'idle') f.velX = 0;

                f.x = Math.max(leftLimit, Math.min(rightLimit, f.x + f.velX));
            } else {
                const target = fighters[0];
                const dist = f.x - target.x;

                f.isBlockingHigh = false;
                f.isBlockingLow = false;

                if (f.actionState === 'idle') {
                    if (Math.abs(dist) > 90) {
                        f.x += dist > 0 ? -CONFIG.AI_SPEED : CONFIG.AI_SPEED;
                    } else {
                        const r = Math.random();
                        if (r < 0.016) fireAttack(f, 'Punch');
                        else if (r < 0.032) fireAttack(f, 'Kick');
                        else if (r < 0.06) f.isBlockingHigh = true;
                        else if (r < 0.09) f.isBlockingLow = true;
                    }
                }
                f.x = Math.max(leftLimit, Math.min(rightLimit, f.x));
            }
        });
                fighters[0].isLeft = fighters[0].x < fighters[1].x;
        fighters[1].isLeft = fighters[1].x < fighters[0].x;

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy; p.alpha -= 0.035;
            if (p.alpha <= 0) particles.splice(i, 1);
        }
        for (let i = flyTexts.length - 1; i >= 0; i--) {
            const t = flyTexts[i];
            t.y += t.vy; t.alpha -= 0.015;
            if (t.alpha <= 0) flyTexts.splice(i, 1);
        }
    }

    function draw() {
        ctx.save();
        if (shakeTimer > 0) {
            ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
            shakeTimer--;
        }

        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, W, H);

        const horizonY = H * 0.42;
        const groundY = H * 0.75;

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let y = horizonY; y <= groundY; y += 18) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }
        for (let x = -W; x <= W * 2; x += 45) {
            ctx.beginPath();
            ctx.moveTo(x, groundY);
            ctx.lineTo(W / 2 + (x - W / 2) * 0.35, horizonY);
            ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
        ctx.lineWidth = 2;
        ctx.strokeRect(CONFIG.OCTAGON_PADDING, horizonY - 110, W - CONFIG.OCTAGON_PADDING * 2, groundY - (horizonY - 110));

        fighters.forEach(f => drawFighterFigure(f));

        for (const p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        for (const t of flyTexts) {
            ctx.fillStyle = t.color;
            ctx.font = 'bold 15px Courier New';
            ctx.fillText(t.str, t.x - 30, t.y);
        }

        ctx.restore();

        update();
        requestAnimationFrame(draw);
    }

    function startGame() {
        SoundFx.init();
        overlay.style.display = 'none';
        fighters = [
            createFighter(W * 0.32, '#00f0ff', true),
            createFighter(W * 0.68, '#ff0055', false)
        ];
        playerHpBar.style.width = '100%';
        enemyHpBar.style.width = '100%';
        playerHpText.innerText = '100';
        enemyHpText.innerText = '100';
        running = true;
    }

    function endGame() {
        running = false;
        overlay.style.display = 'flex';
        overlay.querySelector('h1').innerText = fighters[0].hp <= 0 ? 'KNOCKOUT' : 'VICTORY';
        overlay.querySelector('p').innerText = fighters[0].hp <= 0 ? 'SYSTEM FAILED. REINITIALIZE?' : 'CORE INTACT. CHALLENGER DEFEATED.';
        startBtn.innerText = 'REINITIALIZE COMBAT';
    }

    startBtn.addEventListener('click', startGame);
    requestAnimationFrame(draw);
    </script>
</body>
</html>
