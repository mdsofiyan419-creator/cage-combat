<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MMA 2D Combat Engine Skeleton</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #04080e; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; color: #38bdf8; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #hud-container {
            position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; padding: 14px 16px;
            display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .meta-bar {
            display: flex; justify-content: space-between; font-size: 10px; font-weight: 700;
            letter-spacing: 1.5px; color: #475569; text-transform: uppercase;
        }
        .hp-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 4px; }
        .fighter-meta { width: 42%; }
        .fighter-label { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .bar-shell {
            height: 10px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px; overflow: hidden; position: relative;
        }
        .bar-fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
        .p1-bar { background: linear-gradient(90deg, #0284c7, #38bdf8); }
        .ai-bar { background: linear-gradient(90deg, #e11d48, #fb7185); }

        #engine-badge {
            font-size: 9px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8; padding: 3px 6px; border-radius: 4px; font-weight: 600; text-align: center;
        }

        #diag-btn {
            position: absolute; top: 82px; left: 16px; pointer-events: auto;
            border: 1px solid #38bdf8; background: rgba(4, 8, 14, 0.85); color: #38bdf8;
            padding: 5px 10px; font-size: 10px; font-weight: 700; letter-spacing: 1px;
            cursor: pointer; z-index: 10; border-radius: 6px; backdrop-filter: blur(4px);
        }

        #controls {
            position: absolute; bottom: 18px; left: 0; width: 100%; padding: 0 16px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 10;
        }
        .touch-group { display: flex; gap: 10px; }
        .btn-touch {
            background: rgba(4, 8, 14, 0.75); border: 1.5px solid rgba(56, 189, 248, 0.35);
            color: #f8fafc; font-weight: 700; border-radius: 12px; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); cursor: pointer; pointer-events: auto;
        }
        .btn-move { width: 56px; height: 56px; font-size: 18px; color: #38bdf8; }
        .btn-action { width: 62px; height: 50px; font-size: 11px; letter-spacing: 0.5px; }
        .btn-guard { width: 62px; height: 40px; font-size: 10px; border-color: rgba(148, 163, 184, 0.4); color: #94a3b8; }
        .btn-touch:active { background: #38bdf8; color: #080c14; border-color: #38bdf8; }
    </style>
</head>
<body>
    <div id="hud-container">
        <div class="meta-bar">
            <span>MMA Engine Skeleton // Core Mode</span>
            <span id="fps-counter">60 FPS</span>
        </div>
        <div class="hp-row">
            <div class="fighter-meta">
                <div class="fighter-label"><span>P1 CORE</span><span id="p1-num">100%</span></div>
                <div class="bar-shell"><div id="p1-hp" class="bar-fill p1-bar"></div></div>
            </div>
            <div id="engine-badge">SKELETON<br>TEST RIG</div>
            <div class="fighter-meta">
                <div class="fighter-label"><span>AI RIG</span><span id="ai-num">100%</span></div>
                <div class="bar-shell"><div id="ai-hp" class="bar-fill ai-bar"></div></div>
            </div>
        </div>
    </div>

    <button id="diag-btn">HITBOX RIG: ON</button>

    <div id="controls">
        <div class="touch-group">
            <button id="btnL" class="btn-touch btn-move">◀</button>
            <button id="btnR" class="btn-touch btn-move">▶</button>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
            <div class="touch-group">
                <button id="btnGHi" class="btn-touch btn-guard">GUARD HI</button>
                <button id="btnGLo" class="btn-touch btn-guard">GUARD LO</button>
            </div>
            <div class="touch-group">
                <button id="btnP" class="btn-touch btn-action" style="color: #38bdf8;">PUNCH</button>
                <button id="btnK" class="btn-touch btn-action" style="color: #38bdf8;">KICK</button>
            </div>
        </div>
    </div>

    <canvas id="stage"></canvas>

    <script>
    const CONFIG = {
        P1_SPEED: 3.2,
        AI_SPEED: 1.6,
        PUNCH_REACH: 90,
        KICK_REACH: 110,
        BASE_DAMAGE: 12,
        CHIP_DAMAGE: 2,
        KNOCKBACK: 20
    };

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const diagBtn = document.getElementById('diag-btn');

    const p1HpBar = document.getElementById('p1-hp');
    const p1HpNum = document.getElementById('p1-num');
    const aiHpBar = document.getElementById('ai-hp');
    const aiHpNum = document.getElementById('ai-num');

    let W, H;
    let running = true;
    let debugMode = true;
    let hitFreeze = 0;
    let shakeTimer = 0;

    let particles = [];
    let popups = [];

    const AudioEngine = {
        ctx: null,
        init() {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            }
        },
        strike(isKick) {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = isKick ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(isKick ? 150 : 200, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.15);
        },
        guard() {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(260, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.08);
        }
    };

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function createRig(x, color, isPlayer) {
        return {
            x, y: H * 0.48, color, isPlayer,
            hp: 100, isFacingRight: isPlayer,
            state: 'idle', stateTimer: 0,
            currentAttack: null,
            guardHigh: false, guardLow: false
        };
    }

    // Auto-spawn both fighters immediately
    const fighters = [
        createRig(W * 0.30, '#38bdf8', true),
        createRig(W * 0.70, '#fb7185', false)
    ];

    const input = { left: false, right: false, guardHi: false, guardLo: false };

    function bindTouch(id, key) {
        const el = document.getElementById(id);
        const set = (val) => (e) => { e.preventDefault(); AudioEngine.init(); input[key] = val; };
        el.addEventListener('touchstart', set(true));
        el.addEventListener('touchend', set(false));
        el.addEventListener('mousedown', set(true));
        el.addEventListener('mouseup', set(false));
    }
    bindTouch('btnL', 'left');
    bindTouch('btnR', 'right');
    bindTouch('btnGHi', 'guardHi');
    bindTouch('btnGLo', 'guardLo');

    document.getElementById('btnP').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        AudioEngine.init();
        triggerAttack(fighters[0], 'Punch');
    });
    document.getElementById('btnK').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        AudioEngine.init();
        triggerAttack(fighters[0], 'Kick');
    });

    diagBtn.addEventListener('click', () => {
        debugMode = !debugMode;
        diagBtn.innerText = `HITBOX RIG: ${debugMode ? 'ON' : 'OFF'}`;
        diagBtn.style.color = debugMode ? '#38bdf8' : '#64748b';
        diagBtn.style.borderColor = debugMode ? '#38bdf8' : '#334155';
    });

    function triggerAttack(f, type) {
        if (!running || f.state !== 'idle') return;
        f.currentAttack = type;
        f.state = 'startup';
        f.stateTimer = type === 'Punch' ? 8 : 12;
    }

    function executeHitMath(attacker) {
        const type = attacker.currentAttack;
        const range = type === 'Punch' ? CONFIG.PUNCH_REACH : CONFIG.KICK_REACH;
        const defender = fighters.find(t => t !== attacker);
        const distance = Math.abs(attacker.x - defender.x);

        if (distance <= range) {
            let isBlocked = false;
            if (type === 'Punch' && defender.guardHigh) isBlocked = true;
            if (type === 'Kick' && defender.guardLow) isBlocked = true;

            const hitX = (attacker.x + defender.x) / 2;
            const hitY = defender.y + (type === 'Punch' ? -25 : 45);

            if (isBlocked) {
                AudioEngine.guard();
                defender.hp = Math.max(0, defender.hp - CONFIG.CHIP_DAMAGE);
                popups.push({ x: hitX, y: hitY - 15, txt: 'PARRIED (-2)', color: '#94a3b8', alpha: 1, vy: -1 });
            } else {
                AudioEngine.strike(type === 'Kick');
                defender.hp = Math.max(0, defender.hp - CONFIG.BASE_DAMAGE);
                defender.x += attacker.isFacingRight ? CONFIG.KNOCKBACK : -CONFIG.KNOCKBACK;
                hitFreeze = 3;
                shakeTimer = 6;

                for (let i = 0; i < 14; i++) {
                    particles.push({
                        x: hitX, y: hitY,
                        vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8 - 1,
                        alpha: 1, color: attacker.color
                    });
                }
                popups.push({ x: hitX, y: hitY - 20, txt: `${type.toUpperCase()} LANDED (-${CONFIG.BASE_DAMAGE})`, color: attacker.color, alpha: 1, vy: -1.2 });
            }

            p1HpBar.style.width = fighters[0].hp + '%';
            p1HpNum.innerText = Math.round(fighters[0].hp) + '%';
            aiHpBar.style.width = fighters[1].hp + '%';
            aiHpNum.innerText = Math.round(fighters[1].hp) + '%';

            if (fighters[0].hp <= 0 || fighters[1].hp <= 0) {
                setTimeout(() => {
                    fighters[0].hp = 100;
                    fighters[1].hp = 100;
                    p1HpBar.style.width = '100%';
                    aiHpBar.style.width = '100%';
                    p1HpNum.innerText = '100%';
                    aiHpNum.innerText = '100%';
                }, 1500);
            }
        }
    }

    function renderSkeletonFigure(f) {
        const dir = f.isFacingRight ? 1 : -1;
        const baseY = f.y;
        const headY = baseY - 50;
        const chestY = baseY - 12;
        const hipY = baseY + 25;
        const footY = baseY + 85;

        ctx.save();
        ctx.strokeStyle = f.color;
        ctx.fillStyle = f.color;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Head
        ctx.beginPath();
        ctx.arc(f.x, headY, 12, 0, Math.PI * 2);
        ctx.stroke();

        // Spine
        ctx.beginPath();
        ctx.moveTo(f.x, headY + 12);
        ctx.lineTo(f.x, hipY);
        ctx.stroke();

        // Legs
        if (f.state === 'active' && f.currentAttack === 'Kick') {
            ctx.beginPath();
            ctx.moveTo(f.x, hipY);
            ctx.lineTo(f.x + dir * 30, hipY + 10);
            ctx.lineTo(f.x + dir * 75, hipY + 28);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(f.x, hipY);
            ctx.lineTo(f.x - dir * 18, hipY + 30);
            ctx.lineTo(f.x - dir * 20, footY);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.moveTo(f.x, hipY);
            ctx.lineTo(f.x + dir * 14, hipY + 30);
            ctx.lineTo(f.x + dir * 20, footY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(f.x, hipY);
            ctx.lineTo(f.x - dir * 15, hipY + 30);
            ctx.lineTo(f.x - dir * 18, footY);
            ctx.stroke();
        }

        // Arms
        if (f.state === 'active' && f.currentAttack === 'Punch') {
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 35, chestY - 10);
            ctx.lineTo(f.x + dir * 68, chestY - 10);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x - dir * 10, chestY);
            ctx.lineTo(f.x + dir * 8, headY + 4);
            ctx.stroke();
        } else if (f.guardHigh) {
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 15, headY - 4);
            ctx.lineTo(f.x + dir * 20, headY - 12);
            ctx.stroke();
        } else if (f.guardLow) {
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 18, hipY + 10);
            ctx.lineTo(f.x + dir * 22, hipY + 40);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.moveTo(f.x, chestY);
            ctx.lineTo(f.x + dir * 16, chestY - 6);
            ctx.lineTo(f.x + dir * 20, headY + 4);
            ctx.stroke();
        }

        ctx.restore();

        // Hitbox Overlay
        if (debugMode) {
            ctx.save();
            ctx.lineWidth = 1;
            ctx.font = '9px monospace';

            ctx.strokeStyle = '#ef4444';
            ctx.strokeRect(f.x - 20, headY - 16, 40, 34);
            ctx.fillStyle = '#ef4444';
            ctx.fillText('HIGH_ZONE', f.x + (f.isFacingRight ? 24 : -80), headY);

            ctx.strokeStyle = '#f59e0b';
            ctx.strokeRect(f.x - 22, chestY - 10, 44, 42);
            ctx.fillStyle = '#f59e0b';
            ctx.fillText('MID_ZONE', f.x + (f.isFacingRight ? 24 : -80), chestY + 16);

            ctx.strokeStyle = '#10b981';
            ctx.strokeRect(f.x - 24, hipY + 6, 48, 55);
            ctx.fillStyle = '#10b981';
            ctx.fillText('LOW_ZONE', f.x + (f.isFacingRight ? 24 : -80), hipY + 36);

            ctx.restore();
        }
    }

    function update() {
        if (!running) return;
        if (hitFreeze > 0) { hitFreeze--; return; }

        fighters.forEach(f => {
            f.y = H * 0.48;

            if (f.stateTimer > 0) {
                f.stateTimer--;
                if (f.stateTimer === 0) {
                    if (f.state === 'startup') {
                        f.state = 'active';
                        f.stateTimer = f.currentAttack === 'Punch' ? 6 : 8;
                        executeHitMath(f);
                    } else if (f.state === 'active') {
                        f.state = 'recovery';
                        f.stateTimer = f.currentAttack === 'Punch' ? 12 : 16;
                    } else if (f.state === 'recovery') {
                        f.state = 'idle';
                        f.currentAttack = null;
                    }
                }
            }

            if (f.isPlayer) {
                f.guardHigh = input.guardHi;
                f.guardLow = input.guardLo;

                if (f.state === 'idle') {
                    if (input.left) f.x -= CONFIG.P1_SPEED;
                    if (input.right) f.x += CONFIG.P1_SPEED;
                }
            } else {
                const target = fighters[0];
                const dist = f.x - target.x;

                f.guardHigh = false;
                f.guardLow = false;

                if (f.state === 'idle') {
                    if (Math.abs(dist) > 95) {
                        f.x += dist > 0 ? -CONFIG.AI_SPEED : CONFIG.AI_SPEED;
                    } else {
                        const dice = Math.random();
                        if (dice < 0.012) triggerAttack(f, 'Punch');
                        else if (dice < 0.022) triggerAttack(f, 'Kick');
                        else if (dice < 0.05) f.guardHigh = true;
                        else if (dice < 0.08) f.guardLow = true;
                    }
                }
            }

            f.x = Math.max(50, Math.min(W - 50, f.x));
        });

        fighters[0].isFacingRight = fighters[0].x < fighters[1].x;
        fighters[1].isFacingRight = fighters[1].x < fighters[0].x;

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
            if (p.alpha <= 0) particles.splice(i, 1);
        }
        for (let i = popups.length - 1; i >= 0; i--) {
            const t = popups[i];
            t.y += t.vy; t.alpha -= 0.02;
            if (t.alpha <= 0) popups.splice(i, 1);
        }
    }

    function drawMMAEnclosure() {
        const backWallY = H * 0.28;
        const cageFloorY = H * 0.70;

        const gr = ctx.createLinearGradient(0, 0, 0, H);
        gr.addColorStop(0, '#020509');
        gr.addColorStop(0.35, '#070f1a');
        gr.addColorStop(0.70, '#0c1626');
        gr.addColorStop(1, '#050a12');
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(15, 23, 42, 0.5)';
        ctx.lineWidth = 1;

        for (let y = backWallY; y <= cageFloorY; y += 14) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }
        for (let x = -W; x <= W * 2; x += 38) {
            ctx.beginPath();
            ctx.moveTo(x, cageFloorY);
            ctx.lineTo(W / 2 + (x - W / 2) * 0.35, backWallY);
            ctx.stroke();
        }

        ctx.strokeStyle = '#05111f';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(0, backWallY);
        ctx.lineTo(W * 0.25, backWallY + 30);
        ctx.lineTo(W * 0.75, backWallY + 30);
        ctx.lineTo(W, backWallY);
        ctx.stroke();

        const highWallY = backWallY - 70;
        ctx.beginPath();
        ctx.moveTo(0, highWallY);
        ctx.lineTo(W * 0.25, highWallY + 25);
        ctx.lineTo(W * 0.75, highWallY + 25);
        ctx.lineTo(W, highWallY);
        ctx.stroke();

        const posts = [W * 0.25, W * 0.75];
        posts.forEach(x => {
            const floorOffset = backWallY + 30;
            const ceilingOffset = highWallY + 25;
            ctx.beginPath();
            ctx.moveTo(x, floorOffset);
            ctx.lineTo(x, ceilingOffset);
            ctx.stroke();
            ctx.fillStyle = '#0a1d33';
                        ctx.fillRect(x - 5, ceilingOffset - 3, 10, 6);
        });

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
        ctx.lineWidth = 1.2;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, highWallY, W, backWallY - highWallY + 35);
        ctx.clip();
        for (let i = -W; i < W * 2; i += 8) {
            ctx.beginPath();
            ctx.moveTo(i, highWallY);
            ctx.lineTo(i + 400, backWallY + 60);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(i + 400, highWallY);
            ctx.lineTo(i, backWallY + 60);
            ctx.stroke();
        }
        ctx.restore();

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, backWallY + 30);
        ctx.lineTo(W * 0.25, backWallY + 50);
        ctx.lineTo(W * 0.75, backWallY + 50);
        ctx.lineTo(W, backWallY + 30);
        ctx.stroke();
    }

    function render() {
        ctx.save();
        if (shakeTimer > 0) {
            ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
            shakeTimer--;
        }

        drawMMAEnclosure();
        fighters.forEach(f => renderSkeletonFigure(f));

        for (const p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        for (const t of popups) {
            ctx.fillStyle = t.color;
            ctx.globalAlpha = t.alpha;
            ctx.font = 'bold 11px monospace';
            ctx.fillText(t.txt, t.x - 40, t.y);
        }
        ctx.globalAlpha = 1.0;

        ctx.restore();

        update();
        requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
    </script>
</body>
</html>
